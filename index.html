<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar TV</title>

    <!-- Tags PWA e Cor da Barra de Status do Celular -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d47e6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- OneSignal Web Push SDK -->

      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "60d53fcf-1f37-405f-8fde-c6c8061e17df",
        });
      });
    </script>

    <!-- Ícone para Navegador e Celulares (Android/iOS) -->
    <link rel="icon" type="image/png" href="Logo%20RadarTV%201080x1080.png">
    <link rel="apple-touch-icon" href="Logo%20RadarTV%201080x1080.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
