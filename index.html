<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Player - TV e FM</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f12;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* =======================================
           1. ESTRUTURA DO PLAYER DE TV
           ======================================= */
        .tv-card {
            background-color: #18181c;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .tv-player-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* Proporção 16:9 */
            background-color: #000000;
        }

        .tv-player-wrapper iframe,
        .tv-player-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Overlay da Logo Radar TV (Fundo Transparente & Adaptação) */
        .tv-logo-overlay {
            position: absolute;
            top: 16px;
            left: 16px;
            height: 65px; /* Altura ajustada da logo na TV */
            width: auto;
            object-fit: contain; /* Preserva as proporções originais (1080x1920) */
            background: transparent !important;
            z-index: 10;
            pointer-events: none; /* Permite interagir com o vídeo atrás da logo */
            filter: drop-shadow(0px 2px 6px rgba(0, 0, 0, 0.7));
        }

        /* =======================================
           2. ESTRUTURA DO PLAYER DE RÁDIO (RADAR FM)
           ======================================= */
        .fm-card {
            background-color: #18181c;
            border-radius: 12px;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            flex-wrap: wrap;
            gap: 16px;
        }

        .fm-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* Logo Radar FM (Fundo Transparente & Adaptação) */
        .fm-logo {
            height: 48px; /* Altura ajustada da logo no player de áudio */
            width: auto;
            object-fit: contain;
            background: transparent !important;
            filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.4));
        }

        .fm-details h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
        }

        .fm-details p {
            font-size: 0.85rem;
            color: #8e8e93;
        }

        .fm-controls {
            display: flex;
            align-items: center;
        }

        .btn-play-fm {
            background-color: #e50914;
            border: none;
            color: #ffffff;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .btn-play-fm:hover {
            background-color: #ff0f1a;
            transform: scale(1.05);
        }

        .btn-play-fm svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- PLAYER DE TV -->
        <div class="tv-card">
            <div class="tv-player-wrapper">
                <!-- Marca d'água / Logo Radar TV com fundo transparente -->
                <img src="https://raw.githubusercontent.com/althierestm/Radartvplayer/main/Logo%20RadarTV%201080x1920.png" 
                     alt="Radar TV Logo" 
                     class="tv-logo-overlay">

                <!-- Exemplo de Player de Vídeo/Stream (Substitua a URL do iframe pelo seu link) -->
                <iframe src="https://www.youtube.com/embed/live_stream?channel=SEU_CANAL" allowfullscreen></iframe>
            </div>
        </div>

        <!-- PLAYER DE RÁDIO (RADAR FM) -->
        <div class="fm-card">
            <div class="fm-info">
                <!-- Logo Radar FM com fundo transparente -->
                <img src="https://raw.githubusercontent.com/althierestm/Radartvplayer/main/radarfm.png" 
                     alt="Radar FM Logo" 
                     class="fm-logo">
                
                <div class="fm-details">
                    <h3>Radar FM</h3>
                    <p>Transmitindo ao vivo</p>
                </div>
            </div>

            <div class="fm-controls">
                <button class="btn-play-fm" id="fm-play-btn" title="Ouvir / Pausar">
                    <!-- Ícone Play -->
                    <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <!-- Ícone Pause -->
                    <svg id="icon-pause" viewBox="0 0 24 24" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <!-- URL da transmissão de áudio -->
                <audio id="fm-audio-element" src="SUA_URL_DE_STREAM_AQUI"></audio>
            </div>
        </div>

    </div>

    <script>
        // Lógica de Play/Pause da Rádio FM
        const audioElement = document.getElementById('fm-audio-element');
        const playBtn = document.getElementById('fm-play-btn');
        const iconPlay = document.getElementById('icon-play');
        const iconPause = document.getElementById('icon-pause');

        playBtn.addEventListener('click', () => {
            if (audioElement.paused) {
                audioElement.play();
                iconPlay.style.display = 'none';
                iconPause.style.display = 'block';
            } else {
                audioElement.pause();
                iconPlay.style.display = 'block';
                iconPause.style.display = 'none';
            }
        });
    </script>

</body>
</html>
