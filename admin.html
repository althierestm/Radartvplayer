<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Admin - Catálogo RadarTV</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #0f1115; color: #fff; padding: 20px; margin: 0; }
    h2 { color: #fff; margin-bottom: 20px; }
    
    .admin-catalog-list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 12px; max-width: 800px; }
    .admin-catalog-item { display: flex; justify-content: space-between; align-items: center; background: #181b22; padding: 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); }
    .admin-item-info { display: flex; align-items: center; gap: 15px; }
    .admin-item-poster { width: 50px; height: 75px; object-fit: cover; border-radius: 6px; }
    .admin-item-title { font-weight: bold; font-size: 1.1rem; margin-bottom: 4px; }
    .admin-item-tags { font-size: 0.8rem; color: #4d82ff; background: rgba(77, 130, 255, 0.1); padding: 4px 8px; border-radius: 4px; font-weight: 600; }
    
    .btn-edit { background: rgba(255,255,255,0.1); border: none; color: #fff; padding: 10px 15px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
    .btn-edit:hover { background: #4d82ff; }

    
    .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
    .form-group label { font-size: 0.85rem; color: #8a8f9d; margin-bottom: 5px; }
    .form-group input, .form-group textarea { background: #0f1115; border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 10px; border-radius: 6px; outline: none; }
    .form-group input:focus { border-color: #4d82ff; }
  </style>
</head>
<body>

  <h2><i class="fa-solid fa-film"></i> Gerenciar Catálogo</h2>

  
  <ul class="admin-catalog-list" id="listaFilmesAdmin">
    
    <li class="admin-catalog-item">
      <div class="admin-item-info">
        <img src="https://image.tmdb.org/t/p/w500/8cdWjvZQUExUUTzyp4t6EDMubfO.jpg" class="admin-item-poster">
        <div>
          <div class="admin-item-title">Deadpool & Wolverine</div>
          <span class="admin-item-tags">#Ação, #Comédia</span>
        </div>
      </div>
      <button class="btn-edit" onclick="abrirEdicao('ID_DO_FILME')">
        <i class="fa-solid fa-pen"></i> Editar
      </button>
    </li>
  </ul>

  <hr style="border-color: rgba(255,255,255,0.1); margin: 30px 0;">

<div style="background: #181b22; padding: 20px; border-radius: 10px; max-width: 800px;">
    <h3>Novos Campos Obrigatórios (Formulário)</h3>
    <div class="form-group">
      <label>Hashtags para Abas (separadas por vírgula)</label>
      <input type="text" id="editHashtags" placeholder="Ex: #Ação, #Lançamento, #Suspense">
      <small style="color: #8a8f9d; font-size: 0.75rem; margin-top: 5px;">*O app criará as fileiras automaticamente com base nessas hashtags.</small>
    </div>
    
    <div class="form-group">
      <label>Atores Relacionados</label>
      <input type="text" id="editAtores" placeholder="Ex: Ryan Reynolds, Hugh Jackman">
    </div>
  </div>

</body>
</html>
